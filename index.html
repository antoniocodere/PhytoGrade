<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="PhytoGrade: evidence on plant antioxidants and anti-inflammatories, with an interactive body map."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>PhytoGrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one working column; header + tab rail on top, a single view below, record drawer on the right. */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --sunk: #eaeee8; --ink: #17201a; --muted: #5a675f; --line: #d7dfd8;
  --accent: #5b2a86; --accent-soft: #efe7f6; --on-accent: #ffffff;
  --gA: #1d7447; --gB: #2c64a6; --gC: #9b630f; --gD: #6b737a;
  --gA-bg: #e3f2e9; --gB-bg: #e4edf8; --gC-bg: #f8eedd; --gD-bg: #eceef0;
  --warn: #9b3d12; --warn-bg: #fbeadf;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101411; --surface: #171c18; --sunk: #1d241f; --ink: #e4ebe5; --muted: #9aa79f; --line: #2b352e;
  --accent: #b996e6; --accent-soft: #2a2036; --on-accent: #1a1022;
  --gA: #5cc98f; --gB: #82b2ec; --gC: #e5ad55; --gD: #a3abb2;
  --gA-bg: #16301f; --gB-bg: #182a40; --gC-bg: #33260f; --gD-bg: #242a2e;
  --warn: #f0a37c; --warn-bg: #3a2216; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101411; --surface: #171c18; --sunk: #1d241f; --ink: #e4ebe5; --muted: #9aa79f; --line: #2b352e;
  --accent: #b996e6; --accent-soft: #2a2036; --on-accent: #1a1022;
  --gA: #5cc98f; --gB: #82b2ec; --gC: #e5ad55; --gD: #a3abb2;
  --gA-bg: #16301f; --gB-bg: #182a40; --gC-bg: #33260f; --gD-bg: #242a2e;
  --warn: #f0a37c; --warn-bg: #3a2216; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a { color: var(--accent) }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); letter-spacing: -0.01em }
h2 { font-size: 1.35rem }
h3 { font-size: 1.05rem }
p { margin: 0 }
.muted { color: var(--muted) }
.mono { font-family: var(--f-mono); font-size: .86em }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

/* header */
.top { border-bottom: 1px solid var(--line); background: var(--surface) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0 }
.brand b { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: -0.02em }
.brand b i { font-style: normal; color: var(--accent) }
.brand span { color: var(--muted); font-size: .9rem }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--sunk) }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }
select.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: .9rem }

nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none }
nav.tabs .tab { flex: none; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); padding: 11px 12px 10px; font-weight: 600; white-space: nowrap }
nav.tabs .tab:hover { color: var(--ink) }
nav.tabs .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent) }

main { padding-block: 26px 40px }
.view { display: grid; gap: 20px }
.head { display: grid; gap: 8px; max-width: 70ch }

/* grade + tier marks */
.g { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .86rem; white-space: nowrap }
.g .l { font-family: var(--f-display); width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 7px; font-size: .95rem; color: var(--surface) }
.gA .l { background: var(--gA) } .gB .l { background: var(--gB) } .gC .l { background: var(--gC) } .gD .l, .gnull .l { background: var(--gD) }
.gA { color: var(--gA) } .gB { color: var(--gB) } .gC { color: var(--gC) } .gD, .gnull { color: var(--gD) }
.tier { display: inline-block; font-weight: 700; padding: 4px 10px; border-radius: 999px; font-size: .86rem }
.tierA { background: var(--gA-bg); color: var(--gA) } .tierB { background: var(--gB-bg); color: var(--gB) }
.tierC { background: var(--gC-bg); color: var(--gC) } .tierNC { background: var(--gD-bg); color: var(--gD) }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-family: var(--f-mono); font-size: .78rem; vertical-align: 1px }
.chip:hover { border-color: var(--accent); color: var(--accent) }
.chip.warn::after { content: "!"; color: var(--warn); font-weight: 700 }
.pill { display: inline-block; font-size: .76rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted) }
.pill.warn { background: var(--warn-bg); color: var(--warn) }

/* chat */
.chat { display: grid; gap: 18px; max-width: 780px; width: 100%; margin: 0 auto }
.intro { display: grid; gap: 14px; padding: 6px 0 4px }
.sugg { display: flex; flex-wrap: wrap; gap: 8px }
.sugg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; text-align: left; font-size: .93rem }
.sugg button:hover { border-color: var(--accent); color: var(--accent) }
.msgs { display: grid; gap: 16px }
.msg.u { justify-self: end; max-width: 85%; background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere }
.msg.a { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 14px 18px; min-width: 0; overflow-wrap: anywhere }
.msg.a .md { display: grid; gap: 10px }
.msg.a .md h3, .msg.a .md h4 { font-size: 1rem; margin-top: 4px }
.msg.a .md ul, .msg.a .md ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px }
.msg.a .err { color: var(--warn) }
.think { color: var(--muted); display: inline-flex; gap: 8px; align-items: center }
.think::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7) } }
@media (prefers-reduced-motion: reduce) { .think::before { animation: none } }
.tablewrap { overflow-x: auto; max-width: 100% }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap }
.composer { position: sticky; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-top: 10px; background: linear-gradient(to top, var(--bg) 75%, transparent) }
.box { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px }
.box:focus-within { border-color: var(--accent) }
.box textarea { flex: 1; min-width: 0; border: 0; resize: none; background: transparent; outline: none; padding: 6px 0; max-height: 160px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px; font-weight: 600 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.ghost { background: transparent }
.btn.danger { color: var(--warn); border-color: var(--warn) }
.btn:disabled { opacity: .45; cursor: default }
.fine { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-top: 8px }
.fine button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; color: var(--muted) }
.notice.warn { border-color: transparent; background: var(--warn-bg); color: var(--warn) }

/* compounds */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0 }
button.card:hover { border-color: var(--accent) }
.card h3 { font-size: 1.12rem }
.card .src { color: var(--muted); font-size: .88rem }
.rows { display: grid; border-top: 1px solid var(--line) }
.irow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 6px 18px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.irow .what { display: grid; gap: 4px }
.irow .why { display: grid; gap: 6px; min-width: 0 }
.irow .ids { display: flex; flex-wrap: wrap; gap: 4px }
@media (max-width: 640px) { .irow { grid-template-columns: 1fr } }
.doses { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.doses li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px }
.backlink { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 }

/* compare */
.pick { display: grid; gap: 12px }
.pick label { font-weight: 600; font-size: .9rem }
.pick select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; max-width: 100% }
.reclist { display: grid; gap: 6px }
.recopt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; cursor: pointer }
.recopt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.recopt input { margin-top: 4px; accent-color: var(--accent) }
.recopt small { color: var(--muted) }
.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px }
.side { background: var(--sunk); border-radius: 9px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0 }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: .92rem; font-variant-numeric: tabular-nums }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }

/* data */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px 14px }
.form label { display: grid; gap: 4px; font-size: .84rem; font-weight: 600; color: var(--muted); min-width: 0 }
.form label.wide { grid-column: 1 / -1 }
.form input, .form select, .form textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 9px; color: var(--ink); font-weight: 400; min-width: 0; width: 100% }
.form textarea { min-height: 64px; resize: vertical }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.toast { font-size: .9rem; color: var(--gA); font-weight: 600 }
.toast.bad { color: var(--warn) }
td .actions { flex-wrap: nowrap }
.import textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px; font-family: var(--f-mono); font-size: .8rem }

/* method */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px }
.prose { display: grid; gap: 10px; max-width: 70ch }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 11, .38); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 21; overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 14px; align-content: start }
.drawer .kv { font-size: .9rem }

/* body map: figure (sticky on wide screens) + panel. Organ colours are tokens so both themes stay legible. */
#view-body {
  --b1: #f3f5f1; --b2: #dde4dc; --bs: #bfcac1;
  --o-brain: #eab3c9; --o-brain-s: #b8648a; --o-lung: #f3c1b9; --o-lung-s: #c27a70;
  --o-heart: #d8434d; --o-heart-s: #9c1f2b; --o-vessel: #d8434d;
  --o-liver: #b5604a; --o-liver-s: #7a3626; --o-pan: #f1cb7a; --o-pan-s: #b88d2c;
  --o-imm: #9a7bc9; --o-imm-s: #5b2a86; --o-kid: #bf5d68; --o-kid-s: #84303b;
  --o-gut: #f2ab8f; --o-gut-s: #c46f50; --o-gut-2: #f7cbb6; --o-joint: #5aaeb0; --o-joint-s: #2c7a7c;
  --o-blood: #c8102e; --o-blood-s: #8a0b20;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #view-body {
  --b1: #253028; --b2: #1b231d; --bs: #3a483e;
  --o-brain: #c27b9b; --o-brain-s: #f0b3cc; --o-lung: #b9817a; --o-lung-s: #eab1a8;
  --o-heart: #e0525c; --o-heart-s: #ff9aa1; --o-vessel: #e0525c;
  --o-liver: #a8604e; --o-liver-s: #e3a08c; --o-pan: #c9a24f; --o-pan-s: #f2d38e;
  --o-imm: #9479c6; --o-imm-s: #cdb8f0; --o-kid: #b0606b; --o-kid-s: #eaa1aa;
  --o-gut: #c98468; --o-gut-s: #f1b69d; --o-gut-2: #a87058; --o-joint: #4b9fa1; --o-joint-s: #8fd6d8;
  --o-blood: #ff4d64; --o-blood-s: #ffb0ba } }
:root[data-theme="dark"] #view-body {
  --b1: #253028; --b2: #1b231d; --bs: #3a483e;
  --o-brain: #c27b9b; --o-brain-s: #f0b3cc; --o-lung: #b9817a; --o-lung-s: #eab1a8;
  --o-heart: #e0525c; --o-heart-s: #ff9aa1; --o-vessel: #e0525c;
  --o-liver: #a8604e; --o-liver-s: #e3a08c; --o-pan: #c9a24f; --o-pan-s: #f2d38e;
  --o-imm: #9479c6; --o-imm-s: #cdb8f0; --o-kid: #b0606b; --o-kid-s: #eaa1aa;
  --o-gut: #c98468; --o-gut-s: #f1b69d; --o-gut-2: #a87058; --o-joint: #4b9fa1; --o-joint-s: #8fd6d8;
  --o-blood: #ff4d64; --o-blood-s: #ffb0ba }
.small { font-size: .86rem }
.bm { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) }
@media (min-width: 900px) { .bm { grid-template-columns: minmax(0, 500px) minmax(0, 1fr); align-items: start } .bm-fig { position: sticky; top: 60px } }
.bm-fig { display: grid; gap: 10px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0 }
.bm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; justify-self: stretch }
.bm-tools label { font-weight: 600; font-size: .88rem; color: var(--muted) }
.bm-tools select { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 8px }
.bm-svg { display: block; width: 100%; height: auto; max-height: min(64vh, 560px); overflow: visible; -webkit-tap-highlight-color: transparent; font-family: var(--f-body) }
.bm-svg.wide { max-height: min(74vh, 700px) }
.bm-svg .sil > * { fill: url(#bmSkin); stroke: var(--bs); stroke-width: 1.2 }
.bm-svg .sil { animation: bm-rise .8s ease-out both }
.bm-svg .zone { cursor: pointer; outline: none; transition: opacity .35s ease; transform-box: fill-box; transform-origin: center; animation: bm-pop .6s cubic-bezier(.2, .9, .3, 1.25) both; animation-delay: calc(var(--d, 0ms) + 250ms) }
.bm-svg .zone .hit { fill: transparent; stroke: none }
.bm-svg .org.f { stroke-width: 1.4; transition: stroke .25s, stroke-width .25s }
.bm-svg .zone:hover .org.f, .bm-svg .zone:focus-visible .org.f { stroke-width: 2.6 }
.bm-svg .zone:focus-visible .org.f { stroke: var(--accent) }
.bm-svg .det { fill: none; stroke-width: 1.4; stroke-linecap: round; opacity: .7 }
.bm-svg [data-zone="brain"] .org { fill: var(--o-brain); stroke: var(--o-brain-s) } .bm-svg [data-zone="brain"] .det { stroke: var(--o-brain-s) }
.bm-svg [data-zone="lungs"] .org { fill: var(--o-lung); stroke: var(--o-lung-s) } .bm-svg [data-zone="lungs"] .det { stroke: var(--o-lung-s); opacity: .5 }
.bm-svg .pipe { fill: none; stroke: var(--o-lung-s); stroke-width: 4.5; stroke-linecap: round; opacity: .55 }
.bm-svg [data-zone="heart"] .org { fill: var(--o-heart); stroke: var(--o-heart-s) } .bm-svg [data-zone="heart"] .det { stroke: #fff; opacity: .55 }
.bm-svg .vessels path { fill: none; stroke: var(--o-vessel); stroke-width: 2.2; stroke-linecap: round; opacity: .45 }
.bm-svg .vessels { animation: bm-fade .9s .5s both }
.bm-svg .flow { pointer-events: none; animation: bm-fade 1s 1s both }
.bm-svg .flow circle { fill: var(--o-blood); opacity: .8; transition: r .3s }
.bm-svg.sel-blood .flow circle { r: 3.6px; opacity: 1 }
.bm-svg.sel-blood .vessels { opacity: .75 }
.bm-svg [data-zone="liver"] .org { fill: var(--o-liver); stroke: var(--o-liver-s) } .bm-svg [data-zone="liver"] .det { stroke: var(--o-liver-s) }
.bm-svg [data-zone="pancreas"] .org { fill: var(--o-pan); stroke: var(--o-pan-s) }
.bm-svg [data-zone="kidney"] .org { fill: var(--o-kid); stroke: var(--o-kid-s) }
.bm-svg [data-zone="immune"] .org { fill: var(--o-imm); stroke: var(--o-imm-s) }
.bm-svg [data-zone="joints"] .org { fill: var(--o-joint); fill-opacity: .4; stroke: var(--o-joint-s); stroke-width: 2.2 }
.bm-svg [data-zone="blood"] .org { fill: var(--o-blood); stroke: var(--o-blood-s) }
.bm-svg .shine { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; opacity: .7 }
.bm-svg .tube { fill: none; stroke-linecap: round; stroke-linejoin: round }
.bm-svg .tube.o { stroke: var(--o-gut-s); stroke-width: 13 } .bm-svg .tube.i { stroke: var(--o-gut); stroke-width: 10 }

/* PhytoGrade rule engine: sections 4.5-4.8 of the paper, implemented as code so that
   tiers and grades are deterministic and never decided by the language model. */
const HUMAN = ["human_rct"];
const META = ["meta_analysis"];
const PRECLIN = ["cell", "cell_free", "animal"];
const UNGRADED_KEYS = ["MULTI", "BIOAV"];

function isNum(x) { return typeof x === "number" && isFinite(x); }

/* ---------- reproducibility grade (Table 7) for one compound x indicator ---------- */
function gradeGroup(recs, compoundRecordCount) {
  const usable = recs.filter(r => !UNGRADED_KEYS.includes(r.indicator_key) && r.direction && r.direction !== "");
  if (!usable.length) return { grade: null, reason: "not_graded", counts: {} };
  const dirs = ["up", "down"];
  const tally = d => usable.filter(r => r.direction === d && r.sig === true).length;
  let main = tally("up") >= tally("down") ? "up" : "down";
  if (tally("up") === 0 && tally("down") === 0) {
    const cu = usable.filter(r => r.direction === "up").length, cd = usable.filter(r => r.direction === "down").length;
    main = cu === 0 && cd === 0 ? "none" : (cu >= cd ? "up" : "down");
  }
  const opp = main === "up" ? "down" : main === "down" ? "up" : null;
  // one unit per independent study
  const byStudy = (types) => {
    const m = {};
    for (const r of usable.filter(r => types.includes(r.study_type))) (m[r.study_id] = m[r.study_id] || []).push(r);
    return Object.values(m).map(rs => {
      if (rs.some(r => r.direction === "mixed")) return "mixed";
      if (rs.some(r => r.sig === true && r.direction === main && r.basis !== "within")) return "sig";
      if (opp && rs.some(r => r.sig === true && r.direction === opp && r.basis !== "within")) return "opp";
      if (rs.some(r => r.sig === false)) return "ns";
      return "unk";
    });
  };
  const T = byStudy(HUMAN), M = byStudy(META);
  const n = (arr, s) => arr.filter(x => x === s).length;
  const sigT = n(T, "sig"), nsT = n(T, "ns"), oppT = n(T, "opp"), unkT = n(T, "unk");
  const sigM = n(M, "sig"), nsM = n(M, "ns"), mixM = n(M, "mixed"), oppM = n(M, "opp");
  const preStudies = new Set(usable.filter(r => PRECLIN.includes(r.study_type) && r.direction === main && main !== "none" && r.sig !== false).map(r => r.study_id));
  const pre = preStudies.size;
  const counts = { human: T.length, meta: M.length, preclinical: new Set(usable.filter(r => PRECLIN.includes(r.study_type)).map(r => r.study_id)).size, sigT, nsT, sigM, nsM };
  let grade, reason;
  if (oppT >= 1 && sigT >= 1) { grade = "D"; reason = "opposite_directions"; }
  else if (sigT >= 2 && sigT > nsT) { grade = "A"; reason = "replicated_trials"; }
  else if (sigT >= 1 && nsT >= sigT) { grade = "D"; reason = "conflicting_trials"; }
  else if (sigT === 0 && nsT >= 1) { grade = "D"; reason = "no_effect_trials"; }
  else if (sigT === 0 && T.length === 0 && sigM >= 2 && nsM === 0 && mixM === 0 && oppM === 0) { grade = "A"; reason = "replicated_meta"; }
  else if ((sigM >= 1 && (nsM >= 1 || mixM >= 1 || oppM >= 1))) { grade = "D"; reason = "conflicting_meta"; }
  else if (sigT === 1) { grade = (pre >= 1 || sigM >= 1) ? "B" : "C"; reason = grade === "B" ? "single_trial_supported" : "single_trial"; }
  else if (sigM === 1 && T.length === 0) { grade = "C"; reason = "single_meta"; }
  else if (unkT >= 1) { grade = "C"; reason = "human_unconfirmed"; }
  else if (nsM >= 1 || mixM >= 1) { grade = "D"; reason = "no_effect_meta"; }
  else if (main === "none") { grade = "D"; reason = "no_effect_preclinical"; }
  else if (pre >= 2) { grade = "C"; reason = "preclinical_replicated"; }
  else { grade = "D"; reason = "single_preclinical"; }
  if (compoundRecordCount <= 2 && (grade === "A" || grade === "B")) { grade = "C"; reason = "capped_few_entries"; }
  return { grade, reason, direction: main, counts };
}

function computeGrades(records) {
  const perCompound = {};
  for (const r of records) if (r.indicator_key !== "MULTI") perCompound[r.compound] = (perCompound[r.compound] || 0) + 1;
  const groups = {};
  for (const r of records) {
    if (UNGRADED_KEYS.includes(r.indicator_key)) continue;
    const k = r.compound + "||" + r.indicator_key;
    (groups[k] = groups[k] || []).push(r);
  }
  const out = [];
  for (const [k, rs] of Object.entries(groups)) {
    const [compound, key] = k.split("||");
    const g = gradeGroup(rs, perCompound[compound] || 0);
    out.push({ compound, indicator_key: key, ids: rs.map(r => r.id), ...g });
  }
  return out;
}

/* ---------- comparability tier (Table 6) for a pair of records ---------- */
function pctOf(r) {
  if (isNum(r.pct_t)) return r.pct_t;
  if (isNum(r.change_t) && isNum(r.baseline_t) && r.baseline_t !== 0) return Math.round(r.change_t / r.baseline_t * 1000) / 10;
  return null;
}
function systemOf(r) { return HUMAN.includes(r.study_type) || META.includes(r.study_type) || r.study_type === "human_pk" ? "human" : "preclinical"; }

function tierFor(a, b) {
  if (!a || !b || a.id === b.id) return { tier: null, reason: "same_record" };
  if (a.indicator_key !== b.indicator_key) return { tier: "NC", reason: "different_indicator" };
  if (UNGRADED_KEYS.includes(a.indicator_key)) return { tier: "NC", reason: "not_single_indicator" };
  if (a.basis === "within" || b.basis === "within") return { tier: "NC", reason: "within_group_only" };
  if (systemOf(a) !== systemOf(b)) return { tier: "NC", reason: "different_system" };
  if (a.specimen && b.specimen && a.specimen !== b.specimen) return { tier: "NC", reason: "different_specimen" };
  const weak = ["p_only", "graph_only", "smd", "none"];
  if (weak.includes(a.effect_type) || weak.includes(b.effect_type) || !a.direction || !b.direction)
    return { tier: "C", reason: "direction_only" };
  const sameAssay = a.assay_principle && b.assay_principle && a.assay_principle === b.assay_principle;
  const sameUnit = a.unit && b.unit && a.unit === b.unit;
  const raw = r => r.effect_type === "between_raw" && isNum(r.baseline_t) && isNum(r.effect);
  if (sameAssay && sameUnit && raw(a) && raw(b)) {
    const rel = Math.abs(a.baseline_t - b.baseline_t) / ((a.baseline_t + b.baseline_t) / 2);
    if (rel <= 0.10) return { tier: "A", reason: "raw_values" };
  }
  if (pctOf(a) !== null && pctOf(b) !== null) return { tier: "B", reason: "percent_only" };
  return { tier: "C", reason: "direction_only" };
}

function comparablePairs(records) {
  const byKey = {};
  for (const r of records) (byKey[r.indicator_key] = byKey[r.indicator_key] || []).push(r);
  const out = [];
  for (const rs of Object.values(byKey)) {
    for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
      const t = tierFor(rs[i], rs[j]);
      if (t.tier === "A" || t.tier === "B") out.push({ a: rs[i].id, b: rs[j].id, ...t });
    }
  }
  return out;
}

if (typeof module !== "undefined") module.exports = { gradeGroup, computeGrades, tierFor, comparablePairs, pctOf };

const mqCalm = window.matchMedia("(prefers-reduced-motion: reduce)");
function fitSVG() {
  const svg = $("#bmSvg"); if (!svg) return;
  svg.setAttribute("viewBox", mqWide.matches ? VB_WIDE : VB_NARROW);
  svg.classList.toggle("wide", mqWide.matches);
}
try { mqWide.addEventListener("change", fitSVG); } catch (e) { mqWide.addListener && mqWide.addListener(fitSVG); }

function renderBody() {
  const el = $("#view-body");
  const n = dbNotice();
  if (n) { el.innerHTML = `<div class="head"><h1>${esc(t("body_title"))}</h1></div>${n}`; el.dataset.key = ""; return; }
  const idx = bodyIndex();
  const comps = [...new Set(S.records.map(r => r.compound))].sort((a, b) => a.localeCompare(b));
  if (S.bodyComp && !comps.includes(S.bodyComp)) S.bodyComp = null;
  const key = S.lang + "|" + S.recVer;
  if (el.dataset.key !== key) {
    el.innerHTML = `<div class="head"><h1>${esc(t("body_title"))}</h1><p class="muted">${esc(t("body_sub"))}</p></div>
      <div class="bm">
        <div class="bm-fig">
          <div class="bm-tools"><label for="bmComp">${esc(t("body_filter"))}</label>
            <select id="bmComp"><option value="">${esc(t("body_all_c"))}</option>${comps.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
          ${bodySVG(idx)}
          <div class="bm-chips">${ZONES.map(k => `<button type="button" class="zchip${Object.keys(idx.z[k].comps).length ? "" : " empty"}" data-zone="${k}" style="--zc:var(${ZVAR[k]})"><i></i>${esc(zShort(k))}${Object.keys(idx.z[k].comps).length ? `<b>${Object.keys(idx.z[k].comps).length}</b>` : ""}</button>`).join("")}</div>
          <p class="bm-legend"><span><i class="lg"></i>${esc(t("body_legend_data"))}</span><span><i class="lg empty"></i>${esc(t("body_legend_none"))}</span></p>
        </div>
        <div class="bm-panel" id="bmPanel" aria-live="polite"></div>
      </div>
      <p class="muted small bm-note">${esc(t("body_note"))}</p>`;
    el.dataset.key = key;
    fitSVG();
    if (mqCalm.matches) { try { $("#bmSvg").pauseAnimations(); } catch (e) {} }
  }
  updateBody(false);
}
function updateBody(scroll) {
  const svg = $("#bmSvg"); if (!svg) return;
  const idx = bodyIndex();
  const hl = S.bodyComp ? new Set(ZONES.filter(k => idx.z[k].comps[S.bodyComp])) : null;
  svg.classList.toggle("has-sel", !!S.organ);
  svg.classList.toggle("has-hl", !S.organ && !!hl);
  svg.classList.toggle("sel-blood", S.organ === "blood");
  for (const g of svg.querySelectorAll("[data-zone]")) {
    const k = g.dataset.zone;
    g.classList.toggle("sel", S.organ === k);
    g.classList.toggle("hl", !!hl && hl.has(k));
    if (g.hasAttribute("tabindex")) g.setAttribute("aria-pressed", String(S.organ === k));
  }
  for (const c of document.querySelectorAll("#view-body .zchip")) {
    c.setAttribute("aria-pressed", String(S.organ === c.dataset.zone));
    c.classList.toggle("dim", !!hl && !hl.has(c.dataset.zone));
  }
  const sel = $("#bmComp"); if (sel) sel.value = S.bodyComp || "";
  const panel = $("#bmPanel");
  panel.innerHTML = S.organ ? organPanel(idx, S.organ) : S.bodyComp ? compPanel(idx, S.bodyComp) : defaultPanel(idx);
  if (scroll) {
    const r = panel.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.8) panel.scrollIntoView({ behavior: mqCalm.matches ? "auto" : "smooth", block: "start" });
  }
}
function selectZone(k) { S.organ = S.organ === k ? null : k; updateBody(true); }

document.addEventListener("click", e => {
  if (!e.target.closest) return;
  const goc = e.target.closest("[data-goc]");
  if (goc) { S.compound = goc.dataset.goc; go("compounds", true); return; }
  if (!e.target.closest("#view-body")) return;
  const z = e.target.closest("[data-zone]");
  if (z) { selectZone(z.dataset.zone); return; }
  if (e.target.closest("[data-bm-back]")) { S.organ = null; updateBody(true); return; }
  if (e.target.closest("[data-bm-clear]")) { S.bodyComp = null; updateBody(true); return; }
});
document.addEventListener("keydown", e => {
  const z = e.target.closest && e.target.closest("svg [data-zone][tabindex]");
  if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectZone(z.dataset.zone); }
});
document.addEventListener("change", e => {
  if (e.target.id === "bmComp") { S.bodyComp = e.target.value || null; S.organ = null; updateBody(false); }
});

      <dt>${esc(t("s_adverse"))}</dt><dd>${adv.length ? adv.map(a => `${esc(a.text)} ${chip(a.id)}`).join("<br>") : `<span class="muted">${esc(t("s_adv_none"))}</span>`}</dd>
      <dt>${esc(t("s_claim"))}</dt><dd>${claimHTML(e.name)}</dd>
    </dl>
    <div><button type="button" class="linkbtn" data-goc="${esc(e.name)}">${esc(t("body_full"))} →</button></div>
  </article>`;
}
function nrList(list) {
  return `<ul class="nr-list">${list.map(e => `<li><strong>${esc(e.name)}</strong> — ${esc(t(e.why))} <span class="ids">${e.rs.slice(0, 6).map(r => chip(r.id)).join("")}</span></li>`).join("")}</ul>`;
}

/* ---------- researcher track ---------- */
function supportCell(e) {
  return e.support.map(i => `<span class="sup">${ARROW[i.rs[0].direction] || ""} ${esc(shortInd(i.k))} ${gm(i.g)}</span>`).join(" ");
}
function systemsCell(rs) {
  const by = {};
  for (const r of rs) (by[r.study_type] = by[r.study_type] || new Set()).add(studyKey(r));
  return Object.entries(by).map(([st, s]) => `${esc(t("st_" + st))} × ${s.size}`).join("<br>");
}
function pairsOf(list) {
  const recs = list.flatMap(e => e.support.flatMap(i => i.rs));
  const out = [];
  for (let a = 0; a < recs.length; a++) for (let b = a + 1; b < recs.length; b++) {
    const x = recs[a], y = recs[b];
    if (x.compound === y.compound || x.indicator_key !== y.indicator_key) continue;
    const v = tierFor(x, y); out.push({ x, y, tier: v.tier || "NC", reason: v.reason });
  }
  const o = { A: 0, B: 1, C: 2, NC: 3 };
  /* keep the most comparable pair for each compound pair and indicator */
  const best = {};
  for (const p of out.sort((p, q) => o[p.tier] - o[q.tier])) {
    const k = [p.x.compound, p.y.compound].sort().join("|") + "|" + p.x.indicator_key;
    if (!best[k]) best[k] = p;
  }
  return Object.values(best).sort((p, q) => o[p.tier] - o[q.tier]).slice(0, 10);
}
function researchTable(list) {
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>${esc(t("rs_compound"))}</th><th>${esc(t("rs_grade"))}</th><th>${esc(t("rs_support"))}</th><th>${esc(t("rs_systems"))}</th></tr></thead><tbody>
    ${list.map((e, i) => `<tr><td>${i + 1}</td><td><button type="button" class="linkbtn" data-goc="${esc(e.name)}">${esc(e.name)}</button></td><td>${gradeMark(e.best)}<br><small class="muted">${esc(t("r_" + e.support[0].g.reason))}</small></td>
      <td>${supportCell(e)}<div class="ids">${e.support.flatMap(i => i.rs).map(r => chip(r.id)).join("")}</div></td><td>${systemsCell(e.rs)}</td></tr>`).join("")}</tbody></table></div>`;
}
function nrTable(list) {
  return `<div class="tablewrap"><table><thead><tr><th>${esc(t("rs_compound"))}</th><th>${esc(t("rs_reason"))}</th><th>${esc(t("rs_systems"))}</th><th>${esc(t("rs_results"))}</th></tr></thead><tbody>
    ${list.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(t(e.why))}</td><td>${systemsCell(e.rs)}</td><td><div class="items">${itemsOf(e.name, e.rs).map(itemBtn).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;
}
function pairsHTML(list) {
  const ps = pairsOf(list);
  if (!ps.length) return `<p class="muted">${esc(t("rs_pairs_none"))}</p>`;
  return `<ul class="pairs">${ps.map(p => `<li><span class="tier tier${p.tier}">${esc(t("tier_" + p.tier))}</span> ${esc(shortInd(p.x.indicator_key))}: ${chip(p.x.id)} ${esc(p.x.compound)} ↔ ${chip(p.y.id)} ${esc(p.y.compound)} <small class="muted">${esc(t("t_" + p.reason))}</small></li>`).join("")}</ul>`;
}

/* ---------- one concern, rendered for the current track ---------- */
function concernResult(id) {
  const R = rankConcern(id);
  const research = S.mode === "research";
  const combosRanked = R.combos.filter(e => e.support), combosNR = R.combos.filter(e => !e.support);
  const head = `<div class="sug-head"><h2>${esc(loc(R.c.label))}</h2><p class="muted">${esc(t("sug_sub"))}</p></div>`;
  let body;
  if (research) {
    body = `<h3>${esc(t("rs_rank"))}</h3>${R.ranked.length ? researchTable(R.ranked) : `<div class="notice">${esc(t("sug_none"))}</div>`}
      <h3>${esc(t("rs_pairs"))}</h3>${pairsHTML(R.ranked)}
      ${R.notRanked.length ? `<h3>${esc(t("not_ranked"))}</h3>${nrTable(R.notRanked)}` : ""}`;
  } else {

  return `<div class="sug">${head}${body}${combos}<p class="muted small">${esc(t("disclaimer"))}</p></div>`;

/* ---------- text for the chat context ---------- */
function rankingContext() {
  const line = e => {
    if (!e.support) return `- ${e.name} | NOT RANKED: ${STR.en[e.why]} | records ${e.rs.map(r => r.id).join(",")}`;
    const ing = ingOf(e.name);
    const recs = e.support.flatMap(i => i.rs);
    const adv = adverseOf(recs);
    return `- ${e.name} | best grade ${e.best} | supporting: ${e.support.map(i => `${i.k} ${i.rs[0].direction} (grade ${i.g.grade}; ${i.rs.map(r => r.id).join(",")})`).join("; ")}`
      + ` | study systems: ${[...new Set(e.rs.map(r => r.study_type))].join(", ")}`
      + ` | material: ${materialOf(e.name, e.rs)}`
      + ` | doses used: ${dosesOf(e).map(r => [r.dose, r.duration, r.population].filter(Boolean).join(", ")).join(" / ") || "pooled, no single dose"}`
      + ` | adverse effects: ${adv.length ? adv.map(a => a.text + " [" + a.id + "]").join("; ") : "not recorded in the database"}`
      + ` | approved functional claim: ${!ing || ing.claim_status === "unchecked" || !ing.claim_status ? "not checked yet" : ing.claim_status === "none" ? "none" : `${ing.claim_authority}: "${ing.claim_text}"${ing.claim_condition ? " (" + ing.claim_condition + ")" : ""}${ing.verify ? " [pending confirmation]" : ""}${ing.notes ? " Note: " + ing.notes : ""}`}`;
  };
  return CONCERNS.map(c => {
    const R = rankConcern(c.id);
    const pairs = pairsOf(R.ranked).map(p => `${p.x.id}~${p.y.id} ${p.x.indicator_key} tier ${p.tier} (${p.reason})`).join("; ") || "none";
    return `[${c.id}] ${c.label.en}\nRANKED (in this order):\n${R.ranked.map(line).join("\n") || "- none"}\nNOT RANKED:\n${R.notRanked.map(line).join("\n") || "- none"}\nTIERS BETWEEN CANDIDATES: ${pairs}\nCOMBINATIONS (separate from single compounds):\n${R.combos.map(line).join("\n") || "- none"}`;
  }).join("\n\n");
}

for (const l of Object.keys(EV_STR)) Object.assign(STR[l], EV_STR[l]);

const TYPE_ORDER = ["human_rct", "meta_analysis", "human_pk", "animal", "cell", "cell_free"];
function shortRef(r) {
  const ref = r.reference || r.study_id || r.id;
  const y = (ref.match(/(19|20)\d{2}/) || [""])[0];
  const name = ref.split(/ et al|,|\(| and /)[0].trim();
  return (name + (y ? " " + y : "")).trim();
}
const num = v => typeof v === "number" && isFinite(v);
function pctArm(r, arm) {
  if (num(r["pct_" + arm])) return r["pct_" + arm];
  const c = r["change_" + arm], b = r["baseline_" + arm];
  return num(c) && num(b) && b !== 0 ? Math.round(c / b * 1000) / 10 : null;
}
function parseCI(s) {
  if (!s || /arm/i.test(s)) return null;
  const m = String(s).replace(/−/g, "-").match(/(-?\d+(?:\.\d+)?)\s*(?:to|,|;|–)\s*(-?\d+(?:\.\d+)?)/);
  return m ? [Number(m[1]), Number(m[2])] : null;
}
const fmtPct = v => (v > 0 ? "+" : "") + (Math.round(v * 10) / 10) + "%";
const fmtN = v => (v > 0 ? "+" : "") + fmt(v);
function tipOf(r) {
  return [shortRef(r), t("st_" + r.study_type), indLabel(r.indicator_key) + ": " + t("dir_" + (r.direction || "none")), sigText(r), effectText(r)].filter(Boolean).join(" · ");
}
function markState(r) {
  if (r.sig === true) return r.direction === FAV[catOf(r.indicator_key)] ? "sig" : "bad";
  if (r.sig === false) return "ns";
  return "nr";
}

/* ---------- Figure 1: matrix ---------- */
function evMatrix(c) {
  const by = {};
  for (const r of c.recs) (by[r.study_id || r.id] = by[r.study_id || r.id] || []).push(r);
  const cols = Object.entries(by).sort((a, b) => TYPE_ORDER.indexOf(a[1][0].study_type) - TYPE_ORDER.indexOf(b[1][0].study_type) || shortRef(a[1][0]).localeCompare(shortRef(b[1][0])));
  const keys = [...new Set(c.recs.map(r => r.indicator_key))].sort((a, b) => {
    const ga = S.gi[c.name + "||" + a], gb = S.gi[c.name + "||" + b];
    return GRADE_ORDER[ga ? ga.grade : null] - GRADE_ORDER[gb ? gb.grade : null] || CAT_ORDER.indexOf(catOf(a)) - CAT_ORDER.indexOf(catOf(b));
  });
  const states = new Set(c.recs.map(markState));
  const legend = ["sig", "ns", "nr", "bad"].filter(s => states.has(s)).map(s => `<span><i class="mk ${s}" aria-hidden="true">${s === "ns" ? "=" : "↑"}</i>${esc(t("lg_" + s))}</span>`).join("");
  return `<figure class="fig"><figcaption><h3>${esc(t("fig_matrix"))}</h3><p class="muted small">${esc(t("fig_matrix_sub"))}</p></figcaption>
    <div class="fig-legend">${legend}</div>
    <div class="tablewrap"><table class="mx"><thead><tr><th></th>${cols.map(([, rs]) => `<th scope="col"><span class="mx-ref">${esc(shortRef(rs[0]))}</span><span class="mx-type">${esc(t("ab_" + rs[0].study_type))}</span></th>`).join("")}</tr></thead>
    <tbody>${keys.map(k => `<tr><th scope="row"><span>${esc(shortInd(k))}</span>${gm(S.gi[c.name + "||" + k])}</th>${cols.map(([, rs]) => {
      const here = rs.filter(r => r.indicator_key === k);
      return `<td>${here.map(r => `<button type="button" class="mk ${markState(r)}" data-rec="${esc(r.id)}" data-tip="${esc(tipOf(r))}" aria-label="${esc(r.id + ": " + tipOf(r))}">${ARROW[r.direction] || "·"}</button>`).join("")}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div></figure>`;
}

/* ---------- Figure 2: % change, treated vs control ---------- */
function niceStep(range) {
  const raw = range / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function evBars(c) {
  const rows = c.recs.filter(r => EFFICACY_HUMAN.includes(r.study_type) && pctArm(r, "t") !== null);
  if (!rows.length) return "";
  const vals = rows.flatMap(r => [pctArm(r, "t"), pctArm(r, "c")]).filter(v => v !== null);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const step = niceStep(hi - lo || 10);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const pad = (hi - lo) * 0.16; const dlo = lo - (lo < 0 ? pad : 0), dhi = hi + pad;
  const pos = v => (v - dlo) / (dhi - dlo) * 100;
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  const bar = (v, cls, top, label) => {
    const a = pos(Math.min(0, v)), b = pos(Math.max(0, v));
    return `<span class="b ${cls}${v < 0 ? " neg" : ""}" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;top:${top}px" tabindex="0" data-tip="${esc(label + ": " + fmtPct(v))}" aria-label="${esc(label + ": " + fmtPct(v))}"></span>
      <span class="bv" style="${v >= 0 ? `left:calc(${b}% + 5px)` : `right:calc(${100 - a}% + 5px)`};top:${top - 3}px">${fmtPct(v)}</span>`;
  };
  const grid = ticks.map(v => `<span class="gl${v === 0 ? " zero" : ""}" style="left:${pos(v)}%"></span>`).join("");
  return `<figure class="fig"><figcaption><h3>${esc(t("fig_bars"))}</h3><p class="muted small">${esc(t("fig_bars_sub"))}</p></figcaption>
    <div class="fig-legend"><span><i class="key t"></i>${esc(t("lg_treated"))}</span><span><i class="key c"></i>${esc(t("lg_control"))}</span></div>
    <div class="bars">${rows.map(r => {
      const pt = pctArm(r, "t"), pc = pctArm(r, "c");
      return `<div class="br"><div class="bl"><strong>${esc(shortInd(r.indicator_key))}</strong><small>${esc(shortRef(r))} ${chip(r.id)}</small></div>
        <div class="bp">${grid}${bar(pt, "t", pc !== null ? 7 : 13, t("lg_treated") + " · " + shortRef(r))}${pc !== null ? bar(pc, "c", 21, t("lg_control") + " · " + shortRef(r)) : ""}</div></div>`;
    }).join("")}
      <div class="br axis"><div class="bl"></div><div class="bp">${ticks.map(v => `<span class="tk" style="left:${pos(v)}%">${v > 0 ? "+" : ""}${v}</span>`).join("")}</div></div>
      <div class="br"><div class="bl"></div><div class="axis-title">${esc(t("axis_pct"))}</div></div>
    </div></figure>`;
}

/* ---------- Figure 3: effect with 95% CI ---------- */
function evForest(c) {
  const rows = c.recs.map(r => ({ r, ci: parseCI(r.effect_ci) })).filter(x => num(x.r.effect) && x.ci);
  if (!rows.length) return "";
  const any = { sig: false, ns: false };
  const html = rows.map(({ r, ci }) => {
    const [l, h] = ci[0] <= ci[1] ? ci : [ci[1], ci[0]];
    const m = Math.max(Math.abs(l), Math.abs(h), Math.abs(r.effect)) * 1.15 || 1;
    const pos = v => (v + m) / (2 * m) * 100;
    const sig = l > 0 || h < 0; any[sig ? "sig" : "ns"] = true;
    const metric = r.effect_type === "smd" ? "SMD" : r.effect_type === "md_pooled" ? "MD" + (r.unit ? " " + r.unit : "") : (r.unit || "");
    const label = `${shortInd(r.indicator_key)} · ${shortRef(r)}: ${fmtN(r.effect)} [${fmt(l)}; ${fmt(h)}] ${metric}`;
    return `<div class="fr"><div class="bl"><strong>${esc(shortInd(r.indicator_key))}</strong><small>${esc(shortRef(r))} · ${esc(t("ab_" + r.study_type))} ${chip(r.id)}</small></div>
      <div class="fp" tabindex="0" data-tip="${esc(label)}" aria-label="${esc(label)}"><span class="gl zero" style="left:50%"></span>
        <span class="ci ${sig ? "s" : "n"}" style="left:${pos(l)}%;width:${pos(h) - pos(l)}%"></span><span class="pt ${sig ? "s" : "n"}" style="left:${pos(r.effect)}%"></span></div>
      <div class="fv">${esc(fmtN(r.effect))} <span class="muted">[${esc(fmt(l))}; ${esc(fmt(h))}]</span> <small class="muted">${esc(metric)}</small></div></div>`;
  }).join("");

function recompute() {
  S.records.sort((a, b) => String(a.id).localeCompare(String(b.id)));

function compounds() {
  const m = {};
  for (const r of S.records) {
    const c = m[r.compound] = m[r.compound] || { name: r.compound, source: r.source, form: r.form, recs: [], acts: new Set() };
    c.recs.push(r); if (r.activity) c.acts.add(r.activity);
    if (!c.source && r.source) c.source = r.source;
  }
  for (const c of Object.values(m)) {
    c.grades = S.grades.filter(g => g.compound === c.name).sort((a, b) => GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade] || (b.counts.human || 0) - (a.counts.human || 0) || indLabel(a.indicator_key).localeCompare(indLabel(b.indicator_key)));
    c.best = c.grades[0] || null;
  }
  for (const c of Object.values(m)) c.combo = c.recs.some(isCombo);
  return Object.values(m).sort((a, b) => GRADE_ORDER[a.best ? a.best.grade : null] - GRADE_ORDER[b.best ? b.best.grade : null] || a.name.localeCompare(b.name));
}

/* ---------- markdown (safe subset) ---------- */
function inline(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code class=\"mono\">$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  h = h.replace(/\[([^\]\n]{2,120})\]/g, (m, inner) => {
    const parts = inner.split(/\s*[,;]\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length && parts.every(p => S.byId[p])) return parts.map(chip).join(" ");
    return m;
  });
  return h;
}
function md(text) {
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const out = []; let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|.*\|\s*$/.test(ln)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      if (!body.length) continue;
      const head = cells(body[0]);
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const hm = ln.match(/^\s*(#{1,4})\s+(.*)$/);
    if (hm) { out.push(`<h4>${inline(hm[2])}</h4>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(ln)) {
      const ordered = /^\s*\d+[.)]\s+/.test(ln); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, "")); i++; }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(\||#{1,4}\s|[-*•]\s|\d+[.)]\s)/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

function buildContext() {

  const pairs = S.pairs.map(p => `${p.a} ~ ${p.b} | tier ${p.tier}`).join("\n") || "(none)";
  const gloss = Object.entries(IND).map(([k, v]) => `${k}: ${v.label}; axis ${v.axis}; evidence tag ${v.tag}`).join("\n");
  return `You are the assistant of PhytoGrade, an evidence database of plant secondary metabolites built by a university team (paper: "Development of an Evidence-Based Database of Antioxidant and Anti-inflammatory Plant Secondary Metabolites"). Answer the user's latest message using ONLY the data below.

MODE: ${research ? "RESEARCH (university students and researchers)" : "EVERYDAY (members of the public)"}

HARD RULES
1. Use only the RECORDS, GRADES, PAIRS, RANKINGS and INGREDIENT SHEETS below. If the answer is not there, say the database has no data on it. Never add efficacy claims, numbers, doses or studies from outside knowledge.
2. Cite record IDs in square brackets after each factual statement, e.g. [SIL-01] or [SIL-01, KRG-01].
3. Grades A-D and tiers are computed by code. Report them exactly as given; never invent, upgrade or downgrade them.

6. Compare compounds only through PAIRS. Tier A: raw values may be compared. Tier B: only percentage changes. Any pair not listed: only direction and significance, and say why (different assay, unit, baseline, specimen, study system, or within-group data).
7. A within-group change is never an effect versus placebo. If you use a record marked VERIFY, say it is pending verification against the original paper.

async function ask(q) {
  q = (q || "").trim();
  if (!q || S.busy) return;
  if (!S.sample) { renderAsk(); return; }
  S.chat.push({ role: "user", content: q });
  const msg = { role: "assistant", content: "", pending: true };
  S.chat.push(msg);
  if (!S.records.length) { msg.pending = false; msg.error = t("no_records_chat"); renderAsk(); return; }
  S.busy = true; S.ctl = new AbortController(); renderAsk(); scrollToEnd();
  const history = S.chat.slice(0, -1).filter(m => m.content && !m.error).slice(-9).map(m => ({ role: m.role, content: m.content }));
  const turns = [{ role: "user", content: buildContext() }, ...history];
  let frame = 0;
  try {
    const res = await S.sample(turns, {
      cache: false, signal: S.ctl.signal, modelTier: "default",
      onText: ({ text }) => {
        msg.content = stripConcerns(text).text; msg.pending = false;
        if (!frame) frame = requestAnimationFrame(() => { frame = 0; const el = document.getElementById("m" + (S.chat.length - 1)); if (el) el.innerHTML = `<div class="md">${md(msg.content)}</div>`; });
      }
    });
    const sc = stripConcerns(res.text); msg.content = sc.text; msg.concerns = sc.ids; msg.truncated = !!res.truncated;
  } catch (e) {
    msg.pending = false;
    const code = e && e.code;
    if (e && typeof e.text === "string") msg.content = e.text;
    if (code === "cancelled") msg.note = t("stopped");
    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { S.sample = null; msg.error = t("chat_declined"); }
    else if (code === "rate_limited") msg.error = t("rate");
    else if (code === "refused") { msg.content = ""; msg.error = t("err"); }
    else msg.error = t("err");
  } finally {
    S.busy = false; S.ctl = null; renderAsk();
  }
}
function stripConcerns(text) {
  const s = String(text || "");
  const m = s.match(/\n?[ \t]*CONCERNS?:[ \t]*([^\n]*)\s*$/);
  if (!m) return { text: s.replace(/\n[ \t]*CONC[A-Z]*$/, ""), ids: [] };
  const ids = m[1].split(/[,\s]+/).map(x => x.trim().toLowerCase()).filter(x => CONCERNS.some(c => c.id === x));
  return { text: s.slice(0, m.index).trimEnd(), ids: [...new Set(ids)] };
}

  const rec = readForm();
  const missing = REQUIRED.filter(k => rec[k] == null || rec[k] === "");
  if (missing.length) { S.editing.rec = rec; S.editing.error = t("required") + ": " + missing.join(", "); renderData(); return; }
  if (S.editing.isNew && S.byId[rec.id]) { S.editing.rec = rec; S.editing.error = t("id_taken"); renderData(); return; }
  if (!/^[A-Za-z0-9_.~:@+-]{1,120}$/.test(rec.id)) { S.editing.rec = rec; S.editing.error = t("save_err"); renderData(); return; }
  try {
    await S.db.collection("records").doc(rec.id).set(rec);
    S.editing = null; S.toast = { text: t("saved", { id: rec.id }) };
  } catch (e) {
    S.editing.rec = rec; S.editing.error = e && e.code === "invalid_argument" ? t("write_denied") : t("save_err");
    if (e && e.code === "invalid_argument") S.canWrite = false;
  }
  renderData();
}
async function deleteRec(id) {
  try { await S.db.collection("records").doc(id).delete(); S.toast = { text: t("deleted", { id }) }; }
  catch (e) { S.toast = { text: t("write_denied"), bad: true }; }
  S.confirmDel = null; renderData();
}

/* CSV */
function toCSV(recs) {
  const q = v => { if (v === null || v === undefined) return ""; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [FIELDS.join(","), ...recs.map(r => FIELDS.map(k => q(r[k])).join(","))].join("\r\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function rowsToRecords(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length < 2) return { recs: [], bad: 0 };
  const head = rows[0].map(h => h.trim());
  const recs = []; let bad = 0;
  for (const row of rows.slice(1)) {
    const r = {};
    for (const k of FIELDS) {
      const i = head.indexOf(k); let v = i >= 0 ? (row[i] ?? "").trim() : "";
      if (k === "sig") r[k] = /^(true|yes|1|sí|si|예)$/i.test(v) ? true : /^(false|no|0|아니요)$/i.test(v) ? false : null;
      else if (k === "verify") r[k] = /^(true|yes|1|sí|si|예)$/i.test(v);
      else if (NUMERIC.includes(k)) r[k] = v === "" || !isFinite(Number(v.replace(",", "."))) ? null : Number(v.replace(",", "."));
      else r[k] = v === "" ? null : v;
    }
    if (REQUIRED.every(k => r[k] != null && r[k] !== "") && /^[A-Za-z0-9_.~:@+-]{1,120}$/.test(r.id)) recs.push(r); else bad++;
  }
  return { recs, bad };
}
function importPanel() {
  const ready = S.importRows || [];
  return `<div class="panel import"><h2>${esc(t("import"))}</h2><p class="muted">${esc(t("import_help"))}</p>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <textarea id="csvText" aria-label="CSV"></textarea>
    <div class="actions"><span>${esc(t("import_ok", { n: ready.length }))}</span>${S.importBad ? `<span class="toast bad">${esc(t("import_bad", { n: S.importBad }))}</span>` : ""}
      ${S.importProgress ? `<span>${esc(S.importProgress)}</span>` : ""}
      <button type="button" class="btn primary" data-import-go="1" ${ready.length && !S.importProgress ? "" : "disabled"}>${esc(t("import_go", { n: ready.length }))}</button>
      <button type="button" class="btn ghost" data-import-cancel="1">${esc(t("cancel"))}</button></div></div>`;
}
async function runImport() {
  const recs = S.importRows || []; let done = 0;
  for (const r of recs) {
    S.importProgress = t("importing", { i: done + 1, n: recs.length }); renderData();
    try { await S.db.collection("records").doc(r.id).set(r); done++; }
    catch (e) { S.toast = { text: t("write_denied"), bad: true }; break; }
  }
  S.importProgress = null; S.importRows = null; S.importBad = 0;
  if (done) S.toast = { text: t("imported", { n: done }) };
  renderData();
}
async function downloadCSV(recs, filename) {
  if (!S.downloads) {
    const url = URL.createObjectURL(new Blob(["\ufeff" + toCSV(recs)], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); return true;
  }
  try { await S.downloads.save({ filename, data: "\ufeff" + toCSV(recs) }); return true; }
  catch (e) { return !!(e && e.code === "declined"); }
}
async function exportCSV() {
  if (!(await downloadCSV(S.records, "phytograde_records.csv"))) { S.toast = { text: t("export_fail"), bad: true }; renderData(); }
}

/* ---------- method ---------- */
function renderMethod() {
  const el = $("#view-method");
  el.innerHTML = `<div class="head"><h1>${esc(t("method_title"))}</h1></div>
  <div class="cols">
    <div class="prose"><h2>${esc(t("m_axes"))}</h2><p>${esc(t("m_axes_txt"))}</p>
      ${PUBLIC ? "" : `<h2>${esc(t("m_rules"))}</h2><ul>${t("m_rules_list").map(x => `<li>${esc(x)}</li>`).join("")}</ul>`}
      <h2>${esc(t("m_source"))}</h2><p>${esc(t("m_source_txt"))}</p><p class="muted">${esc(t("disclaimer"))}</p></div>
    <div class="prose"><h2>${esc(t("m_grades"))}</h2>
      <div class="rows">${["A", "B", "C", "D"].map(g => `<div class="irow" style="grid-template-columns:auto 1fr"><div>${gradeMark(g)}</div><div class="muted">${esc({ A: t("r_replicated_trials"), B: t("r_single_trial_supported"), C: t("r_single_trial") + " " + t("r_human_unconfirmed"), D: t("r_single_preclinical") + " " + t("r_conflicting_trials") }[g])}</div></div>`).join("")}</div>
      <h2>${esc(t("m_tiers"))}</h2>
      <div class="rows">${[["A", "raw_values"], ["B", "percent_only"], ["C", "direction_only"], ["NC", "within_group_only"]].map(([k, r]) => `<div class="irow" style="grid-template-columns:auto 1fr"><div><span class="tier tier${k}">${esc(t("tier_" + k))}</span></div><div class="muted">${esc(t("t_" + r))}</div></div>`).join("")}</div>
    </div></div>`;
}

/* ---------- drawer ---------- */
function openRecord(id) {
  const r = S.byId[id]; if (!r) return;
  const g = S.gi[r.compound + "||" + r.indicator_key];
  const rows = FIELDS.filter(k => r[k] !== null && r[k] !== undefined && r[k] !== "" && !(k === "verify" && !r[k]))
    .map(k => {
      let v = r[k];
      if (k === "study_type") v = t("st_" + v);
      else if (k === "sig") v = sigText(r);
      else if (k === "verify") v = t("yes");
      else if (k === "indicator_key") v = v + " · " + indLabel(v);
      return `<dt>${esc(t("f_" + k))}</dt><dd>${k === "doi" ? `<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.doi)}</a>` : esc(fmt(v))}</dd>`;
    }).join("");
  $("#drawer").innerHTML = `<div class="actions" style="justify-content:space-between"><span class="mono">${esc(r.id)}</span><button type="button" class="btn ghost" data-close="1">${esc(t("close"))}</button></div>
    <h2>${esc(r.compound)} · ${esc(indLabel(r.indicator_key))}</h2>
    ${g ? `<div>${gradeMark(g.grade)}<p class="muted">${esc(t("r_" + g.reason))}</p></div>` : ""}
    ${r.verify ? `<div class="notice warn">${esc(t("verify_note", { n: 1 }))}</div>` : ""}
    <dl class="kv">${rows}</dl>`;
  $("#drawer").hidden = false; $("#scrim").hidden = false;
  $("#drawer").querySelector("[data-close]").focus();
}
function closeDrawer() { $("#drawer").hidden = true; $("#scrim").hidden = true; }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-rec], [data-compound]");
  if (!el) return;
  const d = el.dataset;
  if (d.view) { go(d.view); return; }
  if (d.rec) { openRecord(d.rec); return; }
  if (d.mode) { S.mode = d.mode; LS.set("pg-mode", S.mode); renderAll(); return; }
  if (d.q) { ask(d.q); return; }
  if (d.compound) { S.compound = d.compound; renderCompounds(); window.scrollTo(0, 0); return; }
  if (d.back) { S.compound = null; renderCompounds(); return; }
  if (d.close) { closeDrawer(); return; }
  if (d.example) { S.cmpKey = "TAC"; S.cmpSel = ["SIL-01", "KRG-01"]; renderCompare(); return; }
  if (d.add) { S.editing = { isNew: true, rec: { verify: false } }; S.importRows = null; renderData(); return; }
  if (d.edit) { S.editing = { isNew: false, rec: { ...S.byId[d.edit] } }; S.importRows = null; renderData(); $("#recForm")?.scrollIntoView({ block: "start" }); return; }
  if (d.cancelEdit) { S.editing = null; renderData(); return; }
  if (d.del) { S.confirmDel = d.del; renderData(); return; }
  if (d.delNo) { S.confirmDel = null; renderData(); return; }
  if (d.delYes) { deleteRec(d.delYes); return; }
  if (d.import) { S.importRows = []; S.importBad = 0; S.editing = null; renderData(); return; }
  if (d.importCancel) { S.importRows = null; S.importBad = 0; renderData(); return; }
  if (d.importGo) { runImport(); return; }
  if (d.export) { exportCSV(); return; }
  if (d.csvCompound) { const n = d.csvCompound; downloadCSV(S.records.filter(r => r.compound === n), "phytograde_" + ingSlug(n) + ".csv"); return; }
  if (d.concern) { S.concern = S.concern === d.concern ? null : d.concern; renderAsk(); return; }
  if (d.ingEdit) { S.ingEditing = d.ingEdit; S.ingError = null; renderCompounds(); return; }
  if (d.ingCancel) { S.ingEditing = null; renderCompounds(); return; }
  if (el.id === "newChat") { S.chat = []; renderAsk(); return; }
});
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "langSel") { S.lang = el.value; LS.set("pg-lang", S.lang); renderAll(); }
  if (el.id === "cmpKey") { S.cmpKey = el.value; S.cmpSel = []; renderCompare(); }
  if (el.dataset && el.dataset.cmp) {
    const id = el.dataset.cmp;
    if (el.checked) { S.cmpSel = [...S.cmpSel.filter(x => x !== id), id].slice(-2); } else S.cmpSel = S.cmpSel.filter(x => x !== id);
    renderCompare();
  }
  if (el.id === "csvFile" && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const { recs, bad } = rowsToRecords(String(fr.result)); S.importRows = recs; S.importBad = bad; renderData(); };
    fr.readAsText(el.files[0]);
  }
});
let filterTimer = 0;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "recFilter") {
    S.filter = el.value; clearTimeout(filterTimer);
    filterTimer = setTimeout(() => { const pos = el.selectionStart; renderData(); const f = $("#recFilter"); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }, 200);
  }
  if (el.id === "csvText") { const { recs, bad } = rowsToRecords(el.value); S.importRows = recs; S.importBad = bad;
    const span = el.parentElement.querySelector(".actions span"); if (span) span.textContent = t("import_ok", { n: recs.length });
    const go = el.parentElement.querySelector("[data-import-go]"); if (go) { go.disabled = !recs.length; go.textContent = t("import_go", { n: recs.length }); } }
  if (el.id === "askInput") { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 160) + "px"; }
});
document.addEventListener("submit", e => {
  if (e.target.id === "askForm") {
    e.preventDefault();
    if (S.busy) { S.ctl && S.ctl.abort(); return; }
    const inp = $("#askInput"); const q = inp.value; inp.value = ""; inp.style.height = "auto"; ask(q);
  }
  if (e.target.id === "recForm") { e.preventDefault(); saveForm(); }
  if (e.target.id === "ingForm") { e.preventDefault(); saveIng(e.target); }
});
$("#askInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#askForm").requestSubmit(); } });
function go(v, keepCompound) {
  if (!VIEWS.includes(v)) return;
  if (v !== S.view && v === "compounds" && !keepCompound) S.compound = null;
  S.view = v; renderAll(); window.scrollTo(0, 0);
  try { if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); } catch (e) { /* framed documents may refuse URL changes; navigation still works */ }
}
window.addEventListener("hashchange", () => { const v = viewFromHash(); if (v !== S.view && v === "compounds" && !S.keepCompound) S.compound = null; S.keepCompound = false; S.view = v; renderAll(); window.scrollTo(0, 0); });

renderAll();
boot();

</script>
